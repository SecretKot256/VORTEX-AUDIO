<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Radio — VORTEX AUDIO</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="radio.css">
    <link rel="stylesheet" href="toast.css">
</head>
<body>

    <a href="dashboard.html" class="back-btn">← Назад</a>

    <div class="radio-container">
        <h1 class="radio-title">📻 VORTEX RADIO</h1>
        <p class="radio-sub">Только проверенные треки. Выбирай режим и кайфуй.</p>

        <!-- Фильтры -->
        <div class="radio-modes">
            <button class="radio-mode active" onclick="setRadioMode('clean', event)">✅ Чистые</button>
            <button class="radio-mode" onclick="setRadioMode('dirty', event)">🔥 Грязные</button>
            <button class="radio-mode" onclick="setRadioMode('instrumental', event)">🎹 Инструментал</button>
            <button class="radio-mode" onclick="setRadioMode('acoustic', event)">🎸 Акустика</button>
        </div>

        <!-- Поиск -->
        <div class="radio-search">
            <input type="text" id="radioSearchInput" placeholder="Введи название трека или жанр...">
            <button class="radio-search-btn" onclick="searchAndPlay()">🔍 Найти</button>
        </div>

        <!-- Плеер -->
        <div class="radio-player">
            <div class="radio-cover" id="radioCover">🎵</div>
            <div class="radio-info">
                <div class="radio-track" id="radioTrack">Нажми Play, чтобы начать</div>
                <div class="radio-artist" id="radioArtist">VORTEX RADIO</div>
            </div>
            <div class="radio-controls">
                <button class="radio-nav-btn" onclick="prevTrack()">⏮</button>
                <button class="radio-play-btn" id="radioPlayBtn" onclick="toggleRadio()">▶</button>
                <button class="radio-nav-btn" onclick="nextTrack()">⏭</button>
            </div>
        </div>
        <audio id="radioAudio"></audio>
    </div>

    <script src="radio.js"></script>
</body>
</html>
