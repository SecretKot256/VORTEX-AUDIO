<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат — VORTEX AUDIO</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="result.css">
    <link rel="stylesheet" href="toast.css">
</head>
<body>

    <a href="dashboard.html" class="back-btn">← Назад</a>

    <!-- Чёрный загрузочный экран -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Результат -->
    <div class="result-wrapper" id="resultWrapper">

        <!-- 1. ПЕСНЯ -->
        <div class="card card-track" onclick="openPopup('track')">
            <div class="card-fill"></div>
            <div class="card-spinner"></div>
            <div class="card-content">
                <div class="track-cover" id="trackCover"></div>
                <div class="track-info">
                    <div class="track-title" id="trackTitle">—</div>
                    <div class="track-artists" id="trackArtists">—</div>
                    <span class="track-badge" id="trackBadge">—</span>
                </div>
            </div>
        </div>

        <!-- 2. ТЕКСТ -->
        <div class="card card-score" onclick="openPopup('lyrics')">
            <div class="card-fill"></div>
            <div class="card-spinner"></div>
            <div class="card-content">
                <div class="score-label">📝 Оценка текста</div>
                <div class="score-circle" id="lyricsCircle">
                    <span id="lyricsScore">0</span>
                </div>
                <div class="score-verdict" id="lyricsVerdict">—</div>
            </div>
        </div>

        <!-- 3. БИТ -->
        <div class="card card-score" onclick="openPopup('beat')">
            <div class="card-fill"></div>
            <div class="card-spinner"></div>
            <div class="card-content">
                <div class="score-label">🎵 Оценка бита</div>
                <div class="score-circle" id="beatCircle">
                    <span id="beatScore">0</span>
                </div>
                <div class="score-verdict" id="beatVerdict">—</div>
            </div>
        </div>

        <!-- 4. ОБЩАЯ -->
        <div class="card card-overall" onclick="openPopup('overall')">
            <div class="card-fill"></div>
            <div class="card-spinner"></div>
            <div class="card-content">
                <div class="score-label">🌟 Общая оценка</div>
                <div class="score-circle big" id="overallCircle">
                    <span id="overallScore">0</span>
                </div>
                <div class="score-verdict" id="overallVerdict">—</div>
                <div class="score-mood" id="overallMood"></div>
            </div>
        </div>

        <button class="share-btn" onclick="shareResult()">📤 Поделиться</button>
    </div>

    <!-- Попап -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup">
            <button class="popup-close" onclick="closePopup()">✕</button>
            <h2 class="popup-title" id="popupTitle">—</h2>
            <div class="popup-body" id="popupBody">—</div>
        </div>
    </div>

    <script>
        // ===== ДАННЫЕ ИЗ URL =====
        const params = new URLSearchParams(window.location.search);
        const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));

        // ===== СТАРТ =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hide');
                document.getElementById('resultWrapper').classList.add('show');
                animateCards();
            }, 1200);
        });

        // ===== АНИМАЦИЯ КАРТОЧЕК =====
function animateCards() {
    const cards = document.querySelectorAll('.card');
    
    // Заполняем данные СРАЗУ (но контент скрыт CSS-ом)
    fillData();

    cards.forEach((card, i) => {
        // Случайное время загрузки (800-2000 мс)
        const loadTime = 800 + Math.random() * 1200;

        setTimeout(() => {
            // 1. Фиолетовая заливка
            card.classList.add('filled');

            // 2. Через 0.6 сек — фиолетовый убирается + показываем результат
            setTimeout(() => {
                card.classList.add('reveal');
                card.classList.add('loaded');

                // 3. Убираем временные классы
                setTimeout(() => {
                    card.classList.remove('filled', 'reveal');
                }, 1200);
            }, 600);
        }, loadTime + i * 200);
    });
}

        // ===== ЗАПОЛНЕНИЕ =====
        function fillData() {
            // 1. Песня
            document.getElementById('trackTitle').textContent = data.title || '—';
            document.getElementById('trackArtists').textContent = (data.artists || []).join(', ');
            document.getElementById('trackBadge').textContent = data.source === 'genius' ? 'Genius' : 'VORTEX';
            document.getElementById('trackCover').style.backgroundImage = `url('${data.cover_url || 'cover.jpg'}')`;

            // 2. Текст
            const lyricsScore = data.lyrics_analysis?.score || 0;
            document.getElementById('lyricsScore').textContent = lyricsScore;
            document.getElementById('lyricsVerdict').textContent = data.lyrics_analysis?.verdict || '—';
            colorCircle('lyricsCircle', lyricsScore);

            // 3. Бит
            const beatScore = data.beat_analysis?.score || 0;
            document.getElementById('beatScore').textContent = beatScore;
            document.getElementById('beatVerdict').textContent = data.beat_analysis?.description || '—';
            colorCircle('beatCircle', beatScore);

            // 4. Общая
            const overallScore = data.overall?.score || 0;
            document.getElementById('overallScore').textContent = overallScore;
            document.getElementById('overallVerdict').textContent = data.overall?.verdict || '—';
            document.getElementById('overallMood').textContent = data.overall?.mood || '';
            colorCircle('overallCircle', overallScore);
        }

        function colorCircle(id, score) {
            const c = document.getElementById(id);
            if (score >= 8) c.style.borderColor = '#4CAF50';
            else if (score >= 5) c.style.borderColor = '#ffa500';
            else c.style.borderColor = '#e74c3c';
        }

        // ===== ПОПАПЫ =====
        function openPopup(type) {
            const title = document.getElementById('popupTitle');
            const body = document.getElementById('popupBody');

            if (type === 'track') {
                title.textContent = '🎵 О песне';
                body.innerHTML = `
                    <div class="popup-track">
                        <div class="popup-cover" style="background-image: url('${data.cover_url || 'cover.jpg'}')"></div>
                        <div>
                            <div class="popup-track-title">${data.title || '—'}</div>
                            <div class="popup-track-artists">${(data.artists || []).join(', ')}</div>
                            <span class="track-badge">${data.source === 'genius' ? 'Genius' : 'VORTEX'}</span>
                        </div>
                    </div>
                `;
            }

            if (type === 'lyrics') {
                title.textContent = '📝 Анализ текста';
                const bad = data.lyrics_analysis?.bad_words || [];
                body.innerHTML = `
                    <div class="popup-score">${data.lyrics_analysis?.score || 0}/10</div>
                    <p class="popup-text">${data.lyrics_analysis?.verdict || '—'}</p>
                    ${bad.length > 0
                        ? `<div class="popup-bad">⚠️ Найдено: <strong>${bad.join(', ')}</strong></div>`
                        : `<div class="popup-clean">✅ Нецензурных слов нет</div>`}
                    <button class="popup-btn" onclick="showFullLyrics()">📄 Показать текст</button>
                    <button class="popup-btn blue" onclick="translateLyrics()">🌐 Перевести</button>
                `;
            }

            if (type === 'beat') {
                title.textContent = '🎵 Анализ бита';
                body.innerHTML = `
                    <div class="popup-score">${data.beat_analysis?.score || 0}/10</div>
                    <p class="popup-text">${data.beat_analysis?.description || '—'}</p>
                    <div class="popup-details">
                        <div>BPM: <strong>${data.beat_analysis?.bpm || '—'}</strong></div>
                        <div>Стиль: <strong>${data.beat_analysis?.style || '—'}</strong></div>
                    </div>
                `;
            }

            if (type === 'overall') {
                title.textContent = '🌟 Общая оценка';
                body.innerHTML = `
                    <div class="popup-score">${data.overall?.score || 0}/10</div>
                    <p class="popup-text">${data.overall?.verdict || '—'}</p>
                    <p class="popup-text">${data.overall?.mood || ''}</p>
                `;
            }

            document.getElementById('popupOverlay').classList.add('show');
        }

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('show');
        }

        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });

        // ===== ПОКАЗ ТЕКСТА =====
        function showFullLyrics() {
            const lyrics = data.lyrics || 'Текст не найден';
            const bad = data.lyrics_analysis?.bad_words || [];
            let html = lyrics;
            bad.forEach(w => {
                html = html.replace(new RegExp(`(${w})`, 'gi'), '<span class="bad-word">$1</span>');
            });

            document.getElementById('popupTitle').textContent = '📄 Текст песни';
            document.getElementById('popupBody').innerHTML = 
                `<div class="popup-lyrics">${html.replace(/\n/g, '<br>')}</div>`;
        }

        // ===== ПЕРЕВОД =====
        function translateLyrics() {
            const lyrics = data.lyrics || '';
            const lang = /[а-яё]/i.test(lyrics) ? 'ru' : /[áàâãéêíóôõúç]/i.test(lyrics) ? 'pt' : /[áéíóúñü]/i.test(lyrics) ? 'es' : 'en';

            fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${lang}&tl=ru&dt=t&q=${encodeURIComponent(lyrics)}`)
                .then(r => r.json())
                .then(res => {
                    let text = '';
                    res[0].forEach(p => text += p[0]);
                    document.getElementById('popupTitle').textContent = `🌐 Перевод (${lang.toUpperCase()} → RU)`;
                    document.getElementById('popupBody').innerHTML = 
                        `<div class="popup-lyrics">${text.replace(/\n/g, '<br>')}</div>`;
                });
        }

        // ===== ПОДЕЛИТЬСЯ =====
        function shareResult() {
            const text = `Проверил песню в VORTEX AUDIO! Оценка: ${data.overall?.score || '—'}/10`;
            if (navigator.share) {
                navigator.share({ title: 'VORTEX AUDIO', text: text });
            } else {
                navigator.clipboard.writeText(text);
                showToast('Скопировано!', 'success');
            }
        }

        // ===== ТОСТЫ =====
        function showToast(message, type = 'info') {
            let c = document.querySelector('.toast-container');
            if (!c) {
                c = document.createElement('div');
                c.className = 'toast-container';
                document.body.appendChild(c);
            }
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-text">${message}</span>`;
            c.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => {
                t.classList.remove('show');
                t.classList.add('hide');
                setTimeout(() => t.remove(), 600);
            }, 3000);
        }
    </script>
</body>
</html>
