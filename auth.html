<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — VORTEX AUDIO</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="toast.css"> <link rel="stylesheet" href="animations.css">
</head>
<body>

    <a href="index.html" class="back-btn">← На главную</a>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-logo">
                <span class="logo-text">VORTEX AUDIO</span>
            </div>
            
            <h1 class="auth-title" id="authTitle">Вход</h1>
            <p class="auth-subtitle" id="authSubtitle">Войдите в свой аккаунт</p>

            <form class="auth-form" id="authForm" onsubmit="submitAuth(event)">
                <div class="auth-field">
                    <label>Логин</label>
                    <input type="text" id="authLogin" placeholder="username" required autocomplete="username">
                </div>

                <div class="auth-field" id="emailField" style="display: none;">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="email@example.com" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #888;">
                    <input type="checkbox" id="privacyCheckbox" required>
                        <span>Я согласен с <a href="privacy.html" target="_blank" style="color: #6C5CE7;">политикой конфиденциальности</a></span>
                        </label>

                <button type="submit" class="auth-btn" id="authBtn">Войти</button>
            </form>

            <div class="auth-switch">
                <span id="switchText">Нет аккаунта?</span>
                <a href="#" id="switchLink" onclick="switchMode(event)">Зарегистрироваться</a>
            </div>
            <!-- Блок быстрого входа -->
            <div class="social-login-block">
                <div class="social-divider">
                        <span>или войдите через</span>
                            </div>
                                
                                    <div class="social-buttons">
                                            <!-- Google -->
                                                    <button class="social-btn google" onclick="showToast('Вход через Google скоро появится!', 'info')">
                                                                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                                                                        </button>
                                                                                
<button class="social-btn yandex" onclick="loginYandex()">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/58/Yandex_icon.svg" alt="Яндекс" width="24" height="24">
</button> <!-- Яндекс -->
                                                                                                                            
                                                                                                                                    <!-- VK -->
                                                                                                                                            <button class="social-btn vk" onclick="showToast('Вход через VK скоро появится!', 'info')">
                                                                                                                                                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/VK.com_icon_%282020%29.svg" alt="VK" width="24" height="24">
                                                                                                                                                                </button>
                                                                                                                                                                        
                                                                                                                                                                                <!-- Apple -->
                                                                                                                                                                                        <button class="social-btn apple" onclick="showToast('Вход через Apple скоро появится!', 'info')">
                                                                                                                                                                                                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple">
                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                </div>
        </div>
    </div>
    <script src="auth.js">
// ===== ЯНДЕКС ВХОД =====
const YANDEX_CLIENT_ID = "ТВОЙ_CLIENT_ID"; 
const REDIRECT_URI = "https://secretkot256.github.io/VORTEX-AUDIO/auth.html";

function loginYandex() {
    // Перенаправляем на Яндекс
    window.location.href = `https://oauth.yandex.ru/authorize?response_type=code&client_id=${YANDEX_CLIENT_ID}&redirect_uri=${REDIRECT_URI}`;
}

// Проверяем, вернулся ли пользователь с кодом от Яндекса
window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    
    if (code) {
        // Показываем загрузку
        document.body.style.opacity = '0.5';
        
        fetch('https://vortex-audio-2ea62.containers.snapdeploy.app/api/yandex-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                // Сохраняем в localStorage (как при обычном входе)
                localStorage.setItem('vortex_logged_user', res.user.username);
                localStorage.setItem('vortex_logged_email', res.user.email);
                localStorage.setItem('vortex_avatar', res.user.avatar);
                localStorage.setItem('vortex_notes', res.user.notes_balance);
                localStorage.setItem('vortex_free_checks', res.user.free_checks);
                
                window.location.href = 'dashboard.html';
            } else {
                alert('Ошибка входа через Яндекс: ' + res.message);
                document.body.style.opacity = '1';
            }
        })
        .catch(e => {
            console.error(e);
            alert('Ошибка сервера при входе через Яндекс');
            document.body.style.opacity = '1';
        });
    }
});
    </script>
    <script src="toast.js"></script>
</body>
</html>
