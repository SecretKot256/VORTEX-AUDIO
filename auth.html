<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — VORTEX AUDIO</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <a href="index.html" class="back-btn">← На главную</a>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-logo">
                <span class="logo-v">V</span>
                <span class="logo-text">VORTEX AUDIO</span>
            </div>
            
            <h1 class="auth-title" id="authTitle">Вход</h1>
            <p class="auth-subtitle" id="authSubtitle">Войдите в свой аккаунт</p>

            <form class="auth-form" id="authForm" onsubmit="submitAuth(event)">
                <div class="auth-field">
                    <label>Логин</label>
                    <input type="text" id="authLogin" placeholder="username" required autocomplete="username">
                </div>

                <div class="auth-field" id="emailField" style="display: none;">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="email@example.com" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="auth-btn" id="authBtn">Войти</button>
            </form>

            <div class="auth-switch">
                <span id="switchText">Нет аккаунта?</span>
                <a href="#" id="switchLink" onclick="switchMode(event)">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function switchMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const btn = document.getElementById('authBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');
            const emailField = document.getElementById('emailField');

            if (isLoginMode) {
                title.textContent = 'Вход';
                subtitle.textContent = 'Войдите в свой аккаунт';
                btn.textContent = 'Войти';
                switchText.textContent = 'Нет аккаунта?';
                switchLink.textContent = 'Зарегистрироваться';
                emailField.style.display = 'none';
            } else {
                title.textContent = 'Регистрация';
                subtitle.textContent = 'Создайте новый аккаунт';
                btn.textContent = 'Зарегистрироваться';
                switchText.textContent = 'Уже есть аккаунт?';
                switchLink.textContent = 'Войти';
                emailField.style.display = 'block';
            }
        }

        async function submitAuth(e) {
            e.preventDefault();

            const username = document.getElementById('authLogin').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const email = document.getElementById('authEmail').value.trim();

            if (!username || !password) {
                showToast('Заполните все поля!', 'warning');
                return;
            }

            const btn = document.getElementById('authBtn');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Подождите...';
            btn.disabled = true;

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const body = isLoginMode 
                ? { username, password }
                : { username, password, email };

            try {
                const response = await fetch('http://127.0.0.1:5000' + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const result = await response.json();

                if (result.success) {
                    // Сохраняем сессию
                    localStorage.setItem('vortex_logged_user', username);
                    localStorage.setItem('vortex_logged_email', email || '');
                    
                    if (result.user) {
                        localStorage.setItem('vortex_notes', result.user.notes_balance || 0);
                        localStorage.setItem('vortex_free_checks', result.user.free_checks || 1);
                        localStorage.setItem('vortex_subscription', result.user.subscription || 'none');
                    } else {
                        localStorage.setItem('vortex_notes', 0);
                        localStorage.setItem('vortex_free_checks', 1);
                    }

                    showToast(isLoginMode ? 'Добро пожаловать!' : 'Аккаунт создан!', 'success');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else {
                    showToast(result.message || 'Ошибка', 'error');
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                showToast('Сервер недоступен. Запустите backend.py', 'error');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Мини-тосты (встроенные)
        function showToast(message, type = 'info') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type]}</span>
                <span class="toast-text">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body>
</html>
