<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор песни — VORTEX AUDIO</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="select.css">
    <link rel="stylesheet" href="toast.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <a href="dashboard.html" class="back-btn">← Назад</a>

    <!-- Чёрный загрузочный экран -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Ищем песни...</div>
    </div>

    <!-- Контент -->
    <div class="select-wrapper" id="selectWrapper">

        <h1 class="select-title" id="selectTitle">Выбери песню</h1>
        <p class="select-subtitle" id="selectSubtitle">Мы нашли несколько вариантов — выбери нужный</p>

        <!-- Список песен -->
        <div class="songs-list" id="songsList"></div>

        <!-- Если ничего не найдено -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">Ничего не найдено</div>
            <div class="empty-text">Попробуй изменить название или автора</div>
            <a href="dashboard.html" class="empty-btn">← Вернуться</a>
        </div>

    </div>

    <!-- Попап подтверждения -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-popup">
                <button class="confirm-close" onclick="closeConfirm()">✕</button>
                        <div class="confirm-cover" id="confirmCover"></div>
                                <div class="confirm-info">
                                            <h2 class="confirm-title" id="confirmTitle">Название</h2>
                                                        <div class="confirm-artist" id="confirmArtist">Артист</div>
                                                                    <div class="confirm-album" id="confirmAlbum">Альбом</div>
                                                                                
                                                                                            <button class="confirm-play-btn" id="confirmPlayBtn" onclick="togglePreview()">▶ Слушать отрывок</button>
                                                                                                        
                                                                                                                    <div class="confirm-lyrics" id="confirmLyrics">Загрузка текста...</div>
                                                                                                                                
                                                                                                                                            <button class="confirm-submit" onclick="proceedToCheck()">Проверить эту песню</button>
                                                                                                                                                    </div>
                                                                                                                                                        </div>
                                                                                                                                                        </div>-->

    <script src="select.js"></script>
</body>
</html>
